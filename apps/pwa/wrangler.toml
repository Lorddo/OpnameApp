# =============================================================================
# PWA Worker — static assets + same-origin /api/* proxy via service binding
# =============================================================================

name = "opnameapp-pwa"
main = "worker/index.ts"
compatibility_date = "2026-08-01"
account_id = "c4bca857ae3a03d942fa638b2d82f03f"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[services]]
binding = "API"
service = "opnameapp-api"
